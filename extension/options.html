<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>ChatGPT PC Bridge</title><link rel="stylesheet" href="options.css"></head><body><main><h1>ChatGPT PC Bridge</h1><p>独立手机桥接。原编排器继续独立运行，新桥接不重复加载 PC 状态模块。</p><form id="config"><label>本机服务地址<input id="url" value="ws://127.0.0.1:3211/bridge" required></label><label>扩展连接密钥<input id="token" type="password" autocomplete="off" spellcheck="false" required></label><button type="submit">保存并连接</button><button id="refresh" type="button">刷新状态</button><button id="reload" type="button">重新加载扩展</button></form><p id="status" role="status">尚未连接</p><p>扩展密钥来自服务私有目录 extension-auth.json，不是 ChatGPT 登录信息，也不是手机配对密钥。</p><code id="extension"></code><p>手机配对入口：电脑本机 http://127.0.0.1:3211/local/pair。共享对话，但不共享两端未发送的输入框。</p></main><script src="options.js"></script></body></html>
