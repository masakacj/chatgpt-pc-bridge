<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>ChatGPT PC Bridge</title><link rel="stylesheet" href="options.css"></head><body><main><h1>ChatGPT PC Bridge</h1><p>独立桥接开发版。不依赖 Orchestrator；请勿与原生产扩展同时安装。</p><form id="config"><label>本机服务地址<input id="url" value="ws://127.0.0.1:3211/bridge" required></label><label>扩展连接密钥<input id="token" type="password" autocomplete="off" spellcheck="false" required></label><button type="submit">保存并连接</button><button id="refresh" type="button">刷新状态</button></form><p id="status" role="status">尚未连接</p><p>密钥来自独立服务私有目录 extension-auth.json，不是 ChatGPT 登录信息，也不是手机配对密钥。服务需要允许下面的扩展 ID。</p><code id="extension"></code><p>生产迁移尚未完成；不会自动停止旧服务或修改浏览器登录。</p></main><script src="options.js"></script></body></html>
