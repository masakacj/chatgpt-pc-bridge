name: Bridge checks
on:
  workflow_dispatch:
  push:
    paths: ['extension/**', 'service/**', 'src/**', 'test/**', 'scripts/**', 'package*.json', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: pip install playwright==1.63.0
      - run: playwright install --with-deps chromium
      - run: npm run test:browser && npm run test:legacy
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: pc-bridge-development
          path: |
            dist/*.zip
            dist/*.sha256
